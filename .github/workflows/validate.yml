name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event_file:
              title = json.load(event_file)['pull_request']['title']
          if not re.fullmatch(r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([\w./-]+\))?!?: .+', title):
              raise SystemExit('Use a Conventional Commit title, for example: fix: correct MCP configuration')
          PY
